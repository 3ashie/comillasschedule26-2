:root{
  --bg:#EFE4CE;
  --surface:#FBF6EA;
  --surface-2:#E8DBBC;
  --ink:#2A241C;
  --muted:#7C6C51;
  --line:#D9C393;
  --accent:#1F5C6B;
  --accent-ink:#FBF6EA;
  --accent-soft:#D6E5E1;
  --gold:#A9762A;
  --good:#3F6B4A;
  --bad:#A23B2E;
  --bad-soft:#F1DACE;
  --shadow: 0 1px 2px rgba(42,36,28,.09), 0 10px 26px -14px rgba(42,36,28,.30);
  --serif: 'Petrona', Georgia, "Iowan Old Style", "Times New Roman", serif;
  --sans: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161009; --surface:#1F1811; --surface-2:#282016; --ink:#F1E5CE; --muted:#AC9C7E;
    --line:#3B3021; --accent:#6FC1CC; --accent-ink:#0E2124; --accent-soft:#213A3B;
    --gold:#DDAC54; --good:#6FBF8A; --bad:#E38A79; --bad-soft:#3A251E;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 30px -16px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#161009; --surface:#1F1811; --surface-2:#282016; --ink:#F1E5CE; --muted:#AC9C7E;
  --line:#3B3021; --accent:#6FC1CC; --accent-ink:#0E2124; --accent-soft:#213A3B;
  --gold:#DDAC54; --good:#6FBF8A; --bad:#E38A79; --bad-soft:#3A251E;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 30px -16px rgba(0,0,0,.65);
}
:root[data-theme="light"]{
  --bg:#EFE4CE; --surface:#FBF6EA; --surface-2:#E8DBBC; --ink:#2A241C; --muted:#7C6C51;
  --line:#D9C393; --accent:#1F5C6B; --accent-ink:#FBF6EA; --accent-soft:#D6E5E1;
  --gold:#A9762A; --good:#3F6B4A; --bad:#A23B2E; --bad-soft:#F1DACE;
  --shadow: 0 1px 2px rgba(42,36,28,.09), 0 10px 26px -14px rgba(42,36,28,.30);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

.app{max-width:1400px; margin:0 auto; padding:20px 20px 64px;}

/* ---------- Header ---------- */
.app-header{
  position:relative; overflow:hidden;
  display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
  padding:26px 26px 22px; margin-bottom:18px;
  background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
  flex-wrap:wrap;
}
/* A gilt letterhead band across the top — the "official enrollment ledger" cue for the page's one hero moment. */
.app-header::before{
  content:""; position:absolute; top:0; left:0; right:0; height:5px;
  background:linear-gradient(90deg, var(--accent) 0%, var(--accent) 55%, var(--gold) 100%);
}
.app-header h1{
  font-family:var(--serif); font-weight:600; font-size:1.85rem; margin:0 0 5px;
  text-wrap:balance; letter-spacing:.1px;
}
.app-header .eyebrow{
  font-family:var(--sans); font-weight:600; font-size:.7rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--gold); margin:0 0 8px;
}
.app-header p{margin:0; color:var(--muted); font-size:.92rem; max-width:52ch;}
.stat-row{display:flex; gap:10px; flex-wrap:wrap;}
.stat{
  background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
  padding:9px 14px; min-width:88px; text-align:center;
}
.stat .num{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:1.25rem; font-weight:600; display:block;}
.stat .label{font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);}

/* ---------- Layout ---------- */
.layout{display:grid; grid-template-columns:380px 1fr; gap:18px; align-items:start;}
.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
  overflow:hidden;
}

/* ---------- Sidebar / catalog ---------- */
.catalog{display:flex; flex-direction:column; max-height:calc(100vh - 160px); min-height:420px;}
.catalog-controls{padding:16px 16px 12px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:10px;}
.search-input{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink); font-size:.92rem; font-family:var(--sans);
}
.search-input:focus{outline:2px solid var(--accent); outline-offset:1px;}
.filter-row{display:flex; flex-wrap:wrap; gap:8px;}
.dropdown{position:relative;}
.dropdown-trigger{
  display:flex; align-items:center; gap:6px; font-family:var(--sans); font-size:.78rem;
  padding:7px 11px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2);
  color:var(--ink); cursor:pointer; transition:border-color .12s, color .12s;
}
.dropdown-trigger:hover{border-color:var(--accent);}
.dropdown-trigger:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.dropdown-trigger .caret{font-size:.6rem; color:var(--muted); transition:transform .15s;}
.dropdown-trigger.open .caret{transform:rotate(180deg);}
.dropdown-trigger.has-selection{border-color:var(--accent); color:var(--accent);}
.dd-count{
  display:none; background:var(--accent); color:var(--accent-ink); font-size:.65rem; font-weight:700;
  border-radius:999px; padding:1px 6px; line-height:1.3;
}
.dropdown-trigger.has-selection .dd-count{display:inline-block;}
.dropdown-panel{
  position:absolute; top:calc(100% + 6px); left:0; z-index:30; min-width:210px; max-height:260px;
  overflow-y:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow); padding:6px; display:none; flex-direction:column; gap:1px;
}
.dropdown-panel.open{display:flex;}
.dropdown-option{
  display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:6px; cursor:pointer;
  font-size:.84rem; user-select:none;
}
.dropdown-option:hover{background:var(--surface-2);}
.dropdown-option input{accent-color:var(--accent); width:15px; height:15px; flex:none;}
.dropdown-footer{
  display:flex; justify-content:flex-end; padding:6px 4px 2px; margin-top:2px; border-top:1px solid var(--line);
}
.dropdown-footer button{
  background:none; border:none; color:var(--muted); font-size:.76rem; cursor:pointer; padding:2px 4px;
}
.dropdown-footer button:hover{color:var(--accent);}
.result-count{font-size:.72rem; color:var(--muted); padding:2px 2px 0;}

.course-list{overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; flex:1;}
.course-card{
  border:1px solid var(--line); border-radius:12px; padding:12px 13px; background:var(--surface-2);
  display:flex; flex-direction:column; gap:6px;
}
.course-card.is-selected{border-color:var(--accent); background:color-mix(in srgb, var(--accent-soft) 70%, var(--surface-2));}
.course-title{font-family:var(--serif); font-size:.98rem; font-weight:600; line-height:1.3; margin:0;}
.course-meta{display:flex; flex-wrap:wrap; gap:5px; font-size:.68rem;}
.tag{
  font-family:var(--mono); text-transform:uppercase; letter-spacing:.04em;
  padding:2px 7px; border-radius:5px; background:var(--surface); border:1px solid var(--line); color:var(--muted);
}
.tag.ects{color:var(--accent); border-color:color-mix(in srgb, var(--accent) 40%, var(--line));}
.course-sub{font-size:.78rem; color:var(--muted); line-height:1.4;}
.course-sessions{display:flex; flex-wrap:wrap; gap:5px;}
.session-chip{
  font-family:var(--mono); font-size:.7rem; font-variant-numeric:tabular-nums;
  padding:3px 7px; border-radius:6px; background:var(--surface); border:1px solid var(--line);
}
.prereq{font-size:.72rem; color:var(--muted); border-left:2px solid var(--line); padding-left:8px; line-height:1.4;}
.card-actions{display:flex; justify-content:flex-end; margin-top:2px;}
.btn{
  font-family:var(--sans); font-size:.78rem; font-weight:600; padding:7px 14px; border-radius:8px;
  border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); cursor:pointer;
  transition:filter .12s, transform .04s;
}
.btn:hover{filter:brightness(1.06);}
.btn:active{transform:scale(.98);}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.btn.secondary{background:transparent; color:var(--bad); border-color:var(--bad);}
.btn.ghost{background:transparent; color:var(--muted); border-color:var(--line);}
.no-results{padding:32px 16px; text-align:center; color:var(--muted); font-size:.88rem;}

/* ---------- Grid / schedule ---------- */
.schedule-panel{padding:16px 18px 20px; display:flex; flex-direction:column; gap:14px;}
.schedule-toolbar{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.toolbar-actions{display:flex; gap:8px;}

/* ---------- Timetable switcher (save / rename / switch between multiple timetables) ---------- */
.tt-switcher{position:relative;}
.tt-name-btn{
  display:flex; align-items:center; gap:6px; background:none; border:none; padding:2px 4px;
  cursor:pointer; font-family:var(--serif); font-weight:600; font-size:1.05rem; color:var(--ink);
}
.tt-name-btn .tt-caret{font-size:.62rem; color:var(--muted); transition:transform .15s;}
.tt-name-btn.open .tt-caret{transform:rotate(180deg);}
.tt-panel{
  position:absolute; top:calc(100% + 6px); left:0; z-index:35; min-width:230px; max-height:280px;
  overflow-y:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow); padding:6px; display:none; flex-direction:column; gap:1px;
}
.tt-panel.open{display:flex;}
.tt-row{display:flex; align-items:center; gap:1px; border-radius:6px;}
.tt-row.is-active{background:var(--accent-soft); border-radius:6px;}
.tt-row.is-active .tt-row-name{color:var(--accent); font-weight:700;}
.tt-row-name{
  flex:1; text-align:left; background:none; border:none; padding:7px 8px; border-radius:6px;
  cursor:pointer; font-size:.85rem; color:var(--ink); font-family:var(--sans);
}
.tt-row-name:hover{background:var(--surface-2);}
.tt-row-icon{
  background:none; border:none; color:var(--muted); cursor:pointer; font-size:.8rem; padding:6px 7px;
  border-radius:6px; line-height:1; flex:none;
}
.tt-row-icon:hover{background:var(--surface-2); color:var(--accent);}
.tt-row-delete:hover{color:var(--bad); background:var(--bad-soft);}
.tt-add-btn{
  margin-top:3px; padding:9px 8px 6px; border:none; border-top:1px solid var(--line); background:none;
  color:var(--accent); font-size:.82rem; font-weight:600; cursor:pointer; text-align:left; border-radius:0 0 6px 6px;
}
.tt-add-btn:hover{background:var(--surface-2);}
.grid-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
.grid-wrap{position:relative; width:100%; max-width:600px; min-width:420px;}
.grid-days{display:grid; grid-template-columns:52px repeat(5,1fr); border-bottom:1px solid var(--line); background:var(--surface-2);}
.grid-days .corner{padding:8px 0;}
.grid-days .day-label{
  font-family:var(--mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.08em;
  text-align:center; padding:9px 4px; color:var(--muted); border-left:1px solid var(--line);
}
.grid-body{position:relative; display:grid; grid-template-columns:52px repeat(5,1fr);}
.time-axis{position:relative;}
.time-axis .hour-label{
  position:absolute; left:0; right:6px; text-align:right; font-family:var(--mono);
  font-size:.68rem; color:var(--muted); transform:translateY(-50%); font-variant-numeric:tabular-nums;
}
.day-col{position:relative; border-left:1px solid var(--line);}
.hour-line{position:absolute; left:0; right:0; border-top:1px solid var(--line); pointer-events:none;}
.hour-line.half{border-top-style:dashed; opacity:.55;}
.block{
  position:absolute; left:3px; right:3px; border-radius:7px; padding:5px 7px; overflow:hidden;
  border:1px solid rgba(0,0,0,.14); box-shadow:0 2px 6px rgba(30,22,12,.22), inset 0 1px 0 rgba(255,255,255,.22);
  background-image:radial-gradient(140% 120% at 12% 0%, rgba(255,255,255,.20), rgba(255,255,255,0) 55%);
  background-blend-mode:overlay; cursor:pointer;
  display:flex; flex-direction:column; gap:1px;
}
.block .b-name{font-size:.72rem; font-weight:700; line-height:1.2; font-family:var(--sans);}
.block .b-meta{font-size:.63rem; font-family:var(--mono); opacity:.85; line-height:1.25; font-variant-numeric:tabular-nums;}
.block .line-room{display:none;}
.block .b-remove{
  position:absolute; top:3px; right:4px; width:16px; height:16px; border-radius:50%;
  background:rgba(0,0,0,.18); color:#fff; border:none; font-size:.7rem; line-height:16px; text-align:center;
  cursor:pointer; display:none;
}
.block:hover .b-remove{display:block;}

.empty-grid{
  padding:60px 20px; text-align:center; color:var(--muted); font-size:.9rem;
  border:1px dashed var(--line); border-radius:12px; margin-top:4px;
}

/* ---------- Summary / TBD tray ---------- */
.summary-strip{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.summary-pill{
  display:flex; align-items:center; gap:6px; font-size:.78rem; padding:5px 10px 5px 6px;
  border-radius:999px; border:1px solid var(--line); background:var(--surface-2);
}
.swatch{width:10px; height:10px; border-radius:3px; flex:none;}
.summary-pill button{
  background:none; border:none; color:var(--muted); cursor:pointer; font-size:.85rem; padding:0 2px; line-height:1;
}
.tbd-tray{border-top:1px solid var(--line); padding-top:12px;}
.tbd-tray h3{font-family:var(--serif); font-size:.88rem; margin:0 0 8px; color:var(--muted); font-weight:600;}

/* ---------- Toast ---------- */
#toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%, 12px); z-index:50;
  background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:.85rem;
  box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
  max-width:min(480px,86vw); text-align:center;
}
#toast.show{opacity:1; transform:translate(-50%, 0);}
#toast.error{background:var(--bad); color:#fff;}

@media print{
  .catalog, .app-header .stat-row, .toolbar-actions, #toast, .prereq{display:none !important;}
  .layout{grid-template-columns:1fr;}
  body{background:#fff;}
}


/* ---------- Responsive (placed last so these rules win the cascade over same-specificity base rules above) ---------- */
@media (max-width: 900px){
  .app{padding:14px 12px 40px;}
  .app-header{padding:16px 18px;}
  .layout{grid-template-columns:1fr;}
  .schedule-panel{order:-1;}
  .catalog{max-height:62vh; min-height:320px;}
  .chip{padding:7px 12px; font-size:.78rem;}
  .btn{padding:9px 14px;}
}

/* Phone: Everytime-style single-screen UX — timetable is the home view,
   the catalog opens as a full-screen sheet instead of sitting stacked on the page. */
.catalog-mobile-bar{display:none;}
.fab{display:none;}
@media (max-width: 640px){
  .app{padding:10px 12px 28px;}
  .app-header{border:none; border-radius:0; box-shadow:none; flex-direction:column; align-items:flex-start; gap:10px; padding:14px 14px 12px;}
  .app-header h1{font-size:1.28rem;}
  .app-header p{display:none;}
  .stat-row{width:100%;}
  .stat{flex:1; min-width:0; padding:7px 8px;}

  /* Schedule card keeps its rounded/shadowed card look on phones too (Everytime-style card, not edge-to-edge). */
  .schedule-panel{padding:14px 14px 16px; gap:10px;}
  .tt-name-btn{font-size:.98rem;}
  #printBtn{display:none;}
  #summaryStrip{display:none;}

  .grid-wrap{min-width:0;}
  .grid-days, .grid-body{grid-template-columns:30px repeat(5,1fr);}
  .grid-days .day-label{font-size:.72rem; padding:8px 1px; color:var(--ink); font-weight:600; letter-spacing:0;}
  .time-axis .hour-label{font-size:.66rem; right:5px; color:var(--muted); font-family:var(--sans);}
  .block .b-name{font-size:.68rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .block .line-full, .block .b-group{display:none;}
  .block .line-room{display:block; font-size:.6rem; opacity:.95;}
  .block .b-remove{display:flex; align-items:center; justify-content:center;}

  .tbd-tray .summary-pill{
    border-radius:0; border:none; border-bottom:1px solid var(--line); background:none;
    width:100%; justify-content:space-between; padding:9px 2px;
  }

  .catalog-mobile-bar{
    display:flex; align-items:center; justify-content:space-between;
    font-family:var(--serif); font-weight:600; font-size:1rem; padding:0 0 4px;
  }
  .catalog-mobile-bar button{
    background:none; border:none; color:var(--muted); font-size:1.4rem; line-height:1;
    padding:4px 8px; cursor:pointer;
  }
  .catalog{
    position:fixed; inset:0; z-index:40; border-radius:0; max-height:100vh;
    transform:translateY(100%); transition:transform .22s ease; box-shadow:none;
  }
  .catalog.open{transform:translateY(0);}

  .fab{
    display:flex; align-items:center; gap:6px; position:fixed; right:16px; bottom:18px; z-index:45;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px;
    padding:13px 20px; font-family:var(--sans); font-weight:700; font-size:.85rem;
    box-shadow:var(--shadow); cursor:pointer;
  }
  .fab:active{transform:scale(.97);}
}

</style>

const DAYS = ["Mon","Tue","Wed","Thu","Fri"];
const DAY_LABEL = {Mon:"Monday", Tue:"Tuesday", Wed:"Wednesday", Thu:"Thursday", Fri:"Friday"};
const GRID_START = 8*60;   // 08:00 in minutes
const GRID_END = 21*60;    // 21:00 in minutes
const PALETTE = [
  {bg:"#1F5C6B", fg:"#EFFAFA"}, // azulejo cobalt
  {bg:"#B2562C", fg:"#FFF4EA"}, // terracotta tile
  {bg:"#A9762A", fg:"#FFF8E7"}, // gilt ochre
  {bg:"#6E3B54", fg:"#FBEEF4"}, // wrought-iron plum
  {bg:"#6B7A3A", fg:"#F6FAE9"}, // olive grove
  {bg:"#7C1633", fg:"#FBEAEE"}, // garnet
  {bg:"#4A3B6E", fg:"#F1EEFB"}, // fig
  {bg:"#2F5D46", fg:"#EAF6EF"}, // pine
  {bg:"#3A6EA5", fg:"#EDF3FA"}, // sky tile
  {bg:"#C68A1E", fg:"#FFF7E6"}, // saffron
];

const STORAGE_KEY = "icade_fall_2627_timetables_v2";
const LEGACY_STORAGE_KEY = "icade_fall_2627_schedule_v1"; // single-timetable format from before the switcher existed

let state = loadState();               // { timetables: [{id,name,selected:[ids]}], activeId }
let selected = new Set(activeTimetable().selected); // mirrors the active timetable's selection for the render functions below
let langFilter = new Set();       // empty = all
let deptFilter = new Set();       // empty = all
let searchTerm = "";

function activeTimetable(){
  return state.timetables.find(t => t.id === state.activeId) || state.timetables[0];
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.timetables) && parsed.timetables.length){
        parsed.timetables.forEach(t => { t.selected = (t.selected||[]).filter(id => COURSES[id]); });
        if(!parsed.timetables.some(t => t.id === parsed.activeId)) parsed.activeId = parsed.timetables[0].id;
        return parsed;
      }
    }
  }catch(e){}
  // Migrate the old single-timetable storage so returning users don't lose their picks.
  let legacySelected = [];
  try{
    const raw = localStorage.getItem(LEGACY_STORAGE_KEY);
    if(raw) legacySelected = JSON.parse(raw).filter(id => COURSES[id]);
  }catch(e){}
  return { timetables: [{ id: 1, name: "시간표 1", selected: legacySelected }], activeId: 1 };
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function persistSelected(){
  activeTimetable().selected = [...selected];
  saveState();
}
function switchTimetable(id){
  if(id === state.activeId) return;
  state.activeId = id;
  selected = new Set(activeTimetable().selected);
  saveState();
  closeTtPanel();
  render();
  toast(`Switched to "${activeTimetable().name}".`);
}
function addTimetable(){
  const n = state.timetables.length + 1;
  let name = window.prompt("New timetable name:", `시간표 ${n}`);
  if(name === null) return;
  name = name.trim() || `시간표 ${n}`;
  const id = Math.max(0, ...state.timetables.map(t=>t.id)) + 1;
  state.timetables.push({ id, name, selected: [] });
  state.activeId = id;
  selected = new Set();
  saveState();
  closeTtPanel();
  render();
  toast(`Created "${name}".`);
}
function renameTimetable(id){
  const t = state.timetables.find(x => x.id === id);
  if(!t) return;
  const name = window.prompt("Rename timetable:", t.name);
  if(name === null) return;
  t.name = name.trim() || t.name;
  saveState();
  render();
}
function deleteTimetable(id){
  if(state.timetables.length <= 1) return;
  const t = state.timetables.find(x => x.id === id);
  if(!t) return;
  if(!window.confirm(`Delete "${t.name}"? This can't be undone.`)) return;
  state.timetables = state.timetables.filter(x => x.id !== id);
  if(state.activeId === id){
    state.activeId = state.timetables[0].id;
    selected = new Set(activeTimetable().selected);
  }
  saveState();
  render();
  toast(`Deleted "${t.name}".`);
}
function toMinutes(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  return h*60+m;
}
function overlaps(a,b){
  return a.day===b.day && toMinutes(a.start) < toMinutes(b.end) && toMinutes(b.start) < toMinutes(a.end);
}
function colorFor(id){ return PALETTE[id % PALETTE.length]; }
function fmtName(c){
  return c.name.trim();
}

let toastTimer = null;
function toast(msg, type){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (type === 'error' ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.className = ''; }, 3200);
}

function tryAdd(id){
  const course = COURSES[id];
  const sameName = [...selected].filter(sid => COURSES[sid].name === course.name && sid !== id);
  const others = [...selected].filter(sid => !sameName.includes(sid) && sid !== id);

  for(const sid of others){
    const other = COURSES[sid];
    for(const s1 of course.sessions){
      for(const s2 of other.sessions){
        if(overlaps(s1,s2)){
          toast(`Time conflict — "${fmtName(course)}" (${DAY_LABEL[s1.day]} ${s1.start}) overlaps "${fmtName(other)}" (${other.group||''}).`, 'error');
          return;
        }
      }
    }
  }
  sameName.forEach(sid => selected.delete(sid));
  selected.add(id);
  persistSelected();
  if(sameName.length) toast(`Swapped section for "${fmtName(course)}".`);
  else toast(`Added "${fmtName(course)}".`);
  render();
  if(isMobile()) closeCatalog();
}
function removeCourse(id){
  selected.delete(id);
  persistSelected();
  render();
}
function clearAll(){
  if(selected.size===0) return;
  selected.clear();
  persistSelected();
  render();
  toast('Schedule cleared.');
}

function matchesFilters(c){
  if(langFilter.size && !langFilter.has(c.lang)) return false;
  if(deptFilter.size && !deptFilter.has(c.dept)) return false;
  if(searchTerm){
    const hay = [c.name, c.prof, c.dept, c.group, c.room].filter(Boolean).join(' ').toLowerCase();
    if(!hay.includes(searchTerm)) return false;
  }
  return true;
}

function syncDropdown(triggerId, countId, filterSet){
  const trigger = document.getElementById(triggerId);
  document.getElementById(countId).textContent = filterSet.size || '';
  trigger.classList.toggle('has-selection', filterSet.size > 0);
}

function buildDropdown(panelId, triggerId, countId, options, filterSet){
  const panel = document.getElementById(panelId);
  panel.innerHTML = '';
  options.forEach(opt=>{
    const label = document.createElement('label');
    label.className = 'dropdown-option';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = filterSet.has(opt);
    cb.addEventListener('change', ()=>{
      cb.checked ? filterSet.add(opt) : filterSet.delete(opt);
      syncDropdown(triggerId, countId, filterSet);
      renderList();
    });
    const span = document.createElement('span');
    span.textContent = opt;
    label.append(cb, span);
    panel.appendChild(label);
  });
  const footer = document.createElement('div');
  footer.className = 'dropdown-footer';
  const clearBtn = document.createElement('button');
  clearBtn.type = 'button';
  clearBtn.textContent = 'Clear';
  clearBtn.addEventListener('click', ()=>{
    filterSet.clear();
    panel.querySelectorAll('input').forEach(i => i.checked = false);
    syncDropdown(triggerId, countId, filterSet);
    renderList();
  });
  footer.appendChild(clearBtn);
  panel.appendChild(footer);
  syncDropdown(triggerId, countId, filterSet);
}

function closeAllDropdowns(){
  document.querySelectorAll('.dropdown-panel.open').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.dropdown-trigger.open').forEach(t => t.classList.remove('open'));
}
function toggleDropdown(panelId, triggerId){
  const panel = document.getElementById(panelId);
  const wasOpen = panel.classList.contains('open');
  closeAllDropdowns();
  closeTtPanel();
  if(!wasOpen){
    panel.classList.add('open');
    document.getElementById(triggerId).classList.add('open');
  }
}

function renderList(){
  const list = document.getElementById('courseList');
  const filtered = COURSES.filter(matchesFilters);
  document.getElementById('resultCount').textContent = `${filtered.length} of ${COURSES.length} sections`;
  list.innerHTML = '';
  if(!filtered.length){
    const d = document.createElement('div');
    d.className = 'no-results';
    d.textContent = 'No courses match your search or filters.';
    list.appendChild(d);
    return;
  }
  for(const c of filtered){
    const card = document.createElement('article');
    card.className = 'course-card' + (selected.has(c.id) ? ' is-selected' : '');

    const title = document.createElement('p');
    title.className = 'course-title';
    title.textContent = fmtName(c);
    card.appendChild(title);

    const meta = document.createElement('div');
    meta.className = 'course-meta';
    meta.innerHTML = `
      <span class="tag ects">${c.ects} ECTS</span>
      <span class="tag">${c.lang}</span>
      <span class="tag">${c.dept}</span>
      ${c.year ? `<span class="tag">Yr ${c.year}</span>` : ''}
    `;
    card.appendChild(meta);

    const sub = document.createElement('p');
    sub.className = 'course-sub';
    sub.textContent = `${c.group ? c.group + ' · ' : ''}${c.prof || 'Professor TBD'}${c.room ? ' · ' + c.room : ''}`;
    card.appendChild(sub);

    if(c.sessions.length){
      const sess = document.createElement('div');
      sess.className = 'course-sessions';
      c.sessions.forEach(s=>{
        const chip = document.createElement('span');
        chip.className = 'session-chip';
        chip.textContent = `${s.day} ${s.start}–${s.end}`;
        sess.appendChild(chip);
      });
      card.appendChild(sess);
    } else {
      const chip = document.createElement('div');
      chip.className = 'course-sessions';
      chip.innerHTML = '<span class="session-chip">Schedule TBD</span>';
      card.appendChild(chip);
    }

    if(c.prereq){
      const pr = document.createElement('p');
      pr.className = 'prereq';
      pr.textContent = c.prereq;
      card.appendChild(pr);
    }

    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const btn = document.createElement('button');
    btn.type = 'button';
    if(selected.has(c.id)){
      btn.className = 'btn secondary';
      btn.textContent = 'Remove';
      btn.addEventListener('click', ()=>removeCourse(c.id));
    } else {
      const sameNameSelected = [...selected].some(sid => COURSES[sid].name === c.name);
      btn.className = 'btn';
      btn.textContent = sameNameSelected ? 'Switch to this section' : 'Add to schedule';
      btn.addEventListener('click', ()=>tryAdd(c.id));
    }
    actions.appendChild(btn);
    card.appendChild(actions);

    list.appendChild(card);
  }
}

function renderGrid(){
  const area = document.getElementById('gridArea');
  const scheduled = [...selected].filter(id => COURSES[id].sessions.length);

  if(!scheduled.length){
    area.innerHTML = '<div class="empty-grid">Your timetable is empty — search the course list and add a section to get started.</div>';
    return;
  }

  const pxPerMin = 0.92;
  const totalMin = GRID_END - GRID_START;
  const gridHeight = totalMin * pxPerMin;

  let html = `<div class="grid-scroll"><div class="grid-wrap">`;
  html += `<div class="grid-days"><div class="corner"></div>`;
  DAYS.forEach(d => html += `<div class="day-label">${d}</div>`);
  html += `</div>`;

  html += `<div class="grid-body" style="height:${gridHeight}px">`;
  html += `<div class="time-axis">`;
  for(let t = GRID_START; t <= GRID_END; t += 60){
    const top = (t - GRID_START) * pxPerMin;
    const h = t/60;
    html += `<span class="hour-label" style="top:${top}px">${h}</span>`;
  }
  html += `</div>`;

  DAYS.forEach(day => {
    html += `<div class="day-col">`;
    for(let t = GRID_START; t <= GRID_END; t += 30){
      const top = (t - GRID_START) * pxPerMin;
      const isHour = (t % 60 === 0);
      html += `<div class="hour-line${isHour ? '' : ' half'}" style="top:${top}px"></div>`;
    }
    scheduled.forEach(id => {
      const c = COURSES[id];
      const color = colorFor(id);
      c.sessions.filter(s=>s.day===day).forEach(s=>{
        const top = (toMinutes(s.start) - GRID_START) * pxPerMin;
        const height = (toMinutes(s.end) - toMinutes(s.start)) * pxPerMin;
        html += `<div class="block" style="top:${top}px; height:${height}px; background:${color.bg}; color:${color.fg}" data-id="${id}" title="${fmtName(c)}">
          <button class="b-remove" data-remove="${id}" aria-label="Remove ${fmtName(c)}">×</button>
          <span class="b-name">${fmtName(c)}</span>
          <span class="b-meta line-full">${s.start}–${s.end} · ${c.room||''}</span>
          <span class="b-meta line-room">${c.room||''}</span>
          <span class="b-meta b-group">${c.group||''}</span>
        </div>`;
      });
    });
    html += `</div>`;
  });
  html += `</div></div></div>`;
  area.innerHTML = html;

  area.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      removeCourse(Number(btn.dataset.remove));
    });
  });
  area.querySelectorAll('.block').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.b-remove')) return;
      const c = COURSES[Number(el.dataset.id)];
      toast(`${fmtName(c)} · ${c.group || ''} · ${c.room || 'room TBD'} · ${c.prof || ''}`);
    });
  });
}

function renderSummary(){
  const strip = document.getElementById('summaryStrip');
  strip.innerHTML = '';
  const scheduled = [...selected].filter(id => COURSES[id].sessions.length);
  scheduled.sort((a,b)=> a-b).forEach(id=>{
    const c = COURSES[id];
    const color = colorFor(id);
    const pill = document.createElement('div');
    pill.className = 'summary-pill';
    pill.innerHTML = `<span class="swatch" style="background:${color.bg}"></span>${fmtName(c)} <button aria-label="Remove ${fmtName(c)}">×</button>`;
    pill.querySelector('button').addEventListener('click', ()=>removeCourse(id));
    strip.appendChild(pill);
  });
  if(!scheduled.length){
    strip.innerHTML = '<span style="color:var(--muted); font-size:.82rem;">No sections selected yet.</span>';
  }

  const tbdIds = [...selected].filter(id => !COURSES[id].sessions.length);
  const tray = document.getElementById('tbdTray');
  const tbdList = document.getElementById('tbdList');
  if(tbdIds.length){
    tray.hidden = false;
    tbdList.innerHTML = '';
    tbdIds.forEach(id=>{
      const c = COURSES[id];
      const color = colorFor(id);
      const pill = document.createElement('div');
      pill.className = 'summary-pill';
      pill.innerHTML = `<span class="swatch" style="background:${color.bg}"></span>${fmtName(c)} <button aria-label="Remove ${fmtName(c)}">×</button>`;
      pill.querySelector('button').addEventListener('click', ()=>removeCourse(id));
      tbdList.appendChild(pill);
    });
  } else {
    tray.hidden = true;
  }
}

function renderStats(){
  const ids = [...selected];
  document.getElementById('statCourses').textContent = ids.length;
  const ects = ids.reduce((sum,id)=> sum + (COURSES[id].ects||0), 0);
  document.getElementById('statEcts').textContent = ects;
}

function renderTimetableSwitcher(){
  document.getElementById('ttNameLabel').textContent = activeTimetable().name;
  const panel = document.getElementById('ttPanel');
  panel.innerHTML = '';
  state.timetables.forEach(t=>{
    const row = document.createElement('div');
    row.className = 'tt-row' + (t.id === state.activeId ? ' is-active' : '');

    const nameBtn = document.createElement('button');
    nameBtn.type = 'button';
    nameBtn.className = 'tt-row-name';
    nameBtn.textContent = t.name;
    nameBtn.addEventListener('click', ()=>switchTimetable(t.id));
    row.appendChild(nameBtn);

    const renameBtn = document.createElement('button');
    renameBtn.type = 'button';
    renameBtn.className = 'tt-row-icon';
    renameBtn.setAttribute('aria-label', `Rename ${t.name}`);
    renameBtn.textContent = '✎';
    renameBtn.addEventListener('click', (e)=>{ e.stopPropagation(); renameTimetable(t.id); });
    row.appendChild(renameBtn);

    if(state.timetables.length > 1){
      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'tt-row-icon tt-row-delete';
      delBtn.setAttribute('aria-label', `Delete ${t.name}`);
      delBtn.textContent = '🗑';
      delBtn.addEventListener('click', (e)=>{ e.stopPropagation(); deleteTimetable(t.id); });
      row.appendChild(delBtn);
    }
    panel.appendChild(row);
  });

  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'tt-add-btn';
  addBtn.textContent = '+ New timetable';
  addBtn.addEventListener('click', addTimetable);
  panel.appendChild(addBtn);
}

function render(){
  renderTimetableSwitcher();
  renderList();
  renderSummary();
  renderGrid();
  renderStats();
}

document.getElementById('search').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim().toLowerCase();
  renderList();
});
document.getElementById('clearBtn').addEventListener('click', clearAll);
document.getElementById('printBtn').addEventListener('click', ()=>window.print());

const ttNameBtn = document.getElementById('ttNameBtn');
const ttPanel = document.getElementById('ttPanel');
function closeTtPanel(){
  ttPanel.classList.remove('open');
  ttNameBtn.classList.remove('open');
}
function toggleTtPanel(){
  const wasOpen = ttPanel.classList.contains('open');
  closeAllDropdowns();
  closeTtPanel();
  if(!wasOpen){
    ttPanel.classList.add('open');
    ttNameBtn.classList.add('open');
  }
}
ttNameBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  toggleTtPanel();
});

const catalogEl = document.querySelector('.catalog');
function isMobile(){ return window.matchMedia('(max-width: 640px)').matches; }
function openCatalog(){
  catalogEl.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeCatalog(){
  catalogEl.classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('fab').addEventListener('click', openCatalog);
document.getElementById('catalogClose').addEventListener('click', closeCatalog);

document.getElementById('langTrigger').addEventListener('click', (e)=>{
  e.stopPropagation();
  toggleDropdown('langPanel', 'langTrigger');
});
document.getElementById('deptTrigger').addEventListener('click', (e)=>{
  e.stopPropagation();
  toggleDropdown('deptPanel', 'deptTrigger');
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.dropdown')) closeAllDropdowns();
  if(!e.target.closest('.tt-switcher')) closeTtPanel();
});

const LANGS = [...new Set(COURSES.map(c=>c.lang))].sort();
const DEPTS = [...new Set(COURSES.map(c=>c.dept))].sort();
buildDropdown('langPanel', 'langTrigger', 'langCount', LANGS, langFilter);
buildDropdown('deptPanel', 'deptTrigger', 'deptCount', DEPTS, deptFilter);
render();
</script>
</body>
</html>
